config:
  credentials:
  - id: https://github.com/OphidiaBigData/ophidia-workflow-catalogue
    password_var: GIT_PASSWORD
    username_var: GIT_USER
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: fix/updatego
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/OphidiaBigData/ophidia-workflow-catalogue:
      branch: master
      credential_tmp: true
      credentials_id: https://github.com/OphidiaBigData/ophidia-workflow-catalogue
      repo: https://github.com/OphidiaBigData/ophidia-workflow-catalogue
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/OphidiaBigData/ophidia-workflow-catalogue git:
        commands:
        - /usr/bin/env sh .sqa/script.blush_candid_viper.sh
        container: qc.acc_gray_motivated_chimpanzee
  QC.Doc:
    repos:
      github.com/OphidiaBigData/ophidia-workflow-catalogue find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.tan_playful_lionfish.sh
        container: qc.doc_banana_clever_sphinx
      github.com/OphidiaBigData/ophidia-workflow-catalogue git:
        commands:
        - /usr/bin/env sh .sqa/script.currant_understanding_ocelot.sh
        container: qc.doc_goldenrod_optimistic_opossum
      github.com/OphidiaBigData/ophidia-workflow-catalogue markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.ice_insightful_quail.sh
        container: qc.doc_mulberry_affectionate_bear
  QC.Lic:
    repos:
      github.com/OphidiaBigData/ophidia-workflow-catalogue licensee:
        commands:
        - /usr/bin/env sh .sqa/script.crimson_driven_hyena.sh
        container: qc.lic_carmine_easygoing_finch
  QC.Sec:
    repos:
      github.com/OphidiaBigData/ophidia-workflow-catalogue bandit:
        commands:
        - /usr/bin/env sh .sqa/script.lilac_foolish_eel.sh
        container: qc.sec_dusk_wise_lionfish
  QC.Sty:
    repos:
      github.com/OphidiaBigData/ophidia-workflow-catalogue flake8:
        commands:
        - /usr/bin/env sh .sqa/script.caramel_stubborn_flounder.sh
        container: qc.sty_indigo_fearless_lobster
      github.com/OphidiaBigData/ophidia-workflow-catalogue jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.celadon_tranquil_jaguar.sh
        container: qc.sty_chocolate_amused_cougar
      github.com/OphidiaBigData/ophidia-workflow-catalogue pynblint.py:
        commands:
        - /usr/bin/env sh .sqa/script.peony_daring_jackal.sh
        container: qc.sty_pistachio_adventurous_emu
  QC.Uni:
    repos:
      github.com/OphidiaBigData/ophidia-workflow-catalogue pytest:
        commands:
        - /usr/bin/env sh .sqa/script.wave_jubilant_lynx.sh
        container: qc.uni_watermelon_wise_quail
  QC.Ver:
    repos:
      github.com/OphidiaBigData/ophidia-workflow-catalogue get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.pink_understanding_owl.sh
        container: qc.ver_reef_peppy_viper
timeout: 5400
