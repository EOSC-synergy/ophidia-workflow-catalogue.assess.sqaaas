config:
  credentials:
  - id: https://github.com/OphidiaBigData/ophidia-workflow-catalogue
    password_var: GIT_PASSWORD
    username_var: GIT_USER
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: fix/updatego
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/OphidiaBigData/ophidia-workflow-catalogue:
      branch: master
      credential_tmp: true
      credentials_id: https://github.com/OphidiaBigData/ophidia-workflow-catalogue
      repo: https://github.com/OphidiaBigData/ophidia-workflow-catalogue
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/OphidiaBigData/ophidia-workflow-catalogue git:
        commands:
        - /usr/bin/env sh .sqa/script.tundra_supportive_toad.sh
        container: qc.acc_coral_confused_bison
  QC.Doc:
    repos:
      github.com/OphidiaBigData/ophidia-workflow-catalogue find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.eggplant_visionary_hyena.sh
        container: qc.doc_poppy_bubbly_porpoise
      github.com/OphidiaBigData/ophidia-workflow-catalogue git:
        commands:
        - /usr/bin/env sh .sqa/script.papaya_respectful_hare.sh
        container: qc.doc_gunmetal_relaxed_ostrich
      github.com/OphidiaBigData/ophidia-workflow-catalogue markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.ash_sincere_impala.sh
        container: qc.doc_cinnamon_warm_swan
  QC.Lic:
    repos:
      github.com/OphidiaBigData/ophidia-workflow-catalogue licensee:
        commands:
        - /usr/bin/env sh .sqa/script.alabaster_kind_rabbit.sh
        container: qc.lic_cream_blissful_cormorant
  QC.Sec:
    repos:
      github.com/OphidiaBigData/ophidia-workflow-catalogue bandit:
        commands:
        - /usr/bin/env sh .sqa/script.rust_witty_lemur.sh
        container: qc.sec_paprika_zany_starfish
  QC.Sty:
    repos:
      github.com/OphidiaBigData/ophidia-workflow-catalogue flake8:
        commands:
        - /usr/bin/env sh .sqa/script.tundra_imaginative_thrush.sh
        container: qc.sty_champagne_adaptable_swan
      github.com/OphidiaBigData/ophidia-workflow-catalogue jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.chocolate_motivated_rhinoceros.sh
        container: qc.sty_fern_whimsical_wombat
      github.com/OphidiaBigData/ophidia-workflow-catalogue pynblint.py:
        commands:
        - /usr/bin/env sh .sqa/script.thistle_dramatic_wildcat.sh
        container: qc.sty_eggplant_outgoing_ferret
  QC.Uni:
    repos:
      github.com/OphidiaBigData/ophidia-workflow-catalogue pytest:
        commands:
        - /usr/bin/env sh .sqa/script.amethyst_empathetic_gazelle.sh
        container: qc.uni_brown_timid_unicorn
  QC.Ver:
    repos:
      github.com/OphidiaBigData/ophidia-workflow-catalogue get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.cyan_foolish_manatee.sh
        container: qc.ver_echelon_mysterious_peacock
timeout: 5400
